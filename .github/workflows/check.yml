name: Canyon Stock Watcher

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Envoyer une notification de test (n'affecte pas l'état réel)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python check_canyon.py

      - name: Persist state
        run: |
          git add state.json
          if ! git diff --cached --quiet -- state.json; then
            git config user.name "canyon-stock-watcher"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update state [skip ci]"
            git push
          fi
